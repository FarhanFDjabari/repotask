[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "repotask"
version = "0.2.0"
description = "Agent-orchestrated knowledge and workflow CLI for software projects"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "RepoTask Contributors" }]
keywords = ["developer-tools", "workflow", "git", "cli", "ai-agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "httpx>=0.27",
  "tree-sitter>=0.23",
  "tree-sitter-language-pack>=0.7",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.3",
  "pytest-cov>=5",
  "ruff>=0.7",
]

[project.scripts]
repo-task = "repotask.cli:run"

[tool.hatch.build.targets.wheel]
packages = ["src/repotask"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/scripts",
  "/.github",
  "/.gitlab-ci.yml",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# typer declares CLI options as argument defaults; that is the framework's idiom.
"src/repotask/commands/*.py" = ["B008"]
